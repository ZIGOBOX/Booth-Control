name: Build Booth Control V2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate Android project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          data = base64.b64decode("")
          open('BoothControlAndroid.zip','wb').write(data)
          PY
          unzip -q BoothControlAndroid.zip

      - name: Build Android APK
        run: gradle -p BoothControlAndroid assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist-apk
          cp BoothControlAndroid/app/build/outputs/apk/debug/app-debug.apk dist-apk/Booth-Control-V2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Booth-Control-V2-APK
          path: dist-apk/Booth-Control-V2.apk

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Recreate WiFi PC receiver project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          data = base64.b64decode("")
          open('BoothControlReceiver.zip','wb').write(data)
          PY
          unzip -q BoothControlReceiver.zip

      - name: Build portable Windows receiver
        run: dotnet publish BoothControlReceiver/BoothControlReceiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Prepare Windows receiver
        run: |
          mkdir -p dist-pc
          cp BoothControlReceiver/bin/Release/net8.0/win-x64/publish/Booth-Control-WiFi-PC.exe dist-pc/Booth-Control-WiFi-PC.exe
          printf '%s\n' 'MODE WI-FI' '1. Double-clique sur Booth-Control-WiFi-PC.exe sur le PC.' '2. Autorise le pare-feu Windows sur reseau prive si demande.' '3. Laisse la fenetre ouverte et dslrBooth ouvert.' '4. Dans l APK: WI-FI > RECHERCHER LE PC.' > dist-pc/LISEZ-MOI.txt

      - name: Upload Windows receiver
        uses: actions/upload-artifact@v4
        with:
          name: Booth-Control-WiFi-PC
          path: dist-pc/
