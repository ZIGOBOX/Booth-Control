name: Build Booth Control V3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate Android project
        shell: bash
        run: |
          python3 -c "import base64;open('BoothControlAndroid.zip','wb').write(base64.b64decode(''))"
          unzip -q BoothControlAndroid.zip
      - name: Build Android APK
        run: gradle -p BoothControlAndroid assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p dist-apk
          cp BoothControlAndroid/app/build/outputs/apk/debug/app-debug.apk dist-apk/Booth-Control-V3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Booth-Control-V3-APK
          path: dist-apk/Booth-Control-V3.apk

  windows_receiver:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Recreate Windows receiver project
        shell: pwsh
        run: |
          python -c "import base64;open('BoothControlReceiver.zip','wb').write(base64.b64decode(''))"
          Expand-Archive -Path BoothControlReceiver.zip -DestinationPath . -Force
      - name: Build portable Windows receiver
        shell: pwsh
        run: dotnet publish BoothControlReceiver/BoothControlReceiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Prepare Windows receiver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-pc | Out-Null
          Copy-Item BoothControlReceiver/bin/Release/net8.0-windows/win-x64/publish/Booth-Control-WiFi-PC.exe dist-pc/Booth-Control-WiFi-PC-V3.exe
          @('BOOTH CONTROL V3 - MODE WI-FI','1. Lance Booth-Control-WiFi-PC-V3.exe sur le PC.','2. Autorise le pare-feu Windows sur reseau prive si demande.','3. Laisse dslrBooth et cette fenetre ouverts.','4. Dans l APK, choisis WI-FI puis TROUVER LE PC.','5. Le port est automatiquement 17500.','6. PHOTOS DE L EVENEMENT affiche les images du dossier Prints de l evenement le plus recent.') | Set-Content -Encoding UTF8 dist-pc/LISEZ-MOI.txt
      - name: Upload Windows receiver
        uses: actions/upload-artifact@v4
        with:
          name: Booth-Control-WiFi-PC-V3
          path: dist-pc/
